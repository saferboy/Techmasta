services:
  postgres:
    image: postgres:15
    container_name: postgres-techmasta
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: techmasta
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - techmasta-network

  redis:
    image: redis:latest
    container_name: redis-techmasta
    ports:
      - "6379:6379"
    networks:
      - techmasta-network

volumes:
  postgres-data:

networks:
  techmasta-network:
    driver: bridge